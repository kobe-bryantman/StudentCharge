<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('编辑课程 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">编辑课程</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/teacher/course/edit}" method="post">
                <input type="hidden" name="id" th:value="${course.id}">
                <div class="form-group">
                    <label>课程名称 <span style="color:red">*</span></label>
                    <input type="text" name="courseName" class="form-control" th:value="${course.courseName}" required>
                </div>
                <div class="form-group">
                    <label>课程描述</label>
                    <textarea name="description" class="form-control" th:text="${course.description}" placeholder="请输入课程描述"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a th:href="@{/teacher/course/list}" class="btn btn-secondary">返回</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
