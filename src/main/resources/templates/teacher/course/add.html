<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('新增课程 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">新增课程</h1>

    <div class="card">
        <div class="card-body">
            <!-- 错误提示 -->
            <div class="msg msg-error" th:if="${msg != null}" th:text="${msg}"></div>

            <form th:action="@{/teacher/course/add}" method="post">
                <div class="form-group">
                    <label>课程名称 <span style="color:red">*</span></label>
                    <input type="text" name="courseName" class="form-control" placeholder="请输入课程名称" required>
                </div>
                <div class="form-group">
                    <label>课程描述</label>
                    <textarea name="description" class="form-control" placeholder="请输入课程描述"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/teacher/course/list}" class="btn btn-secondary">返回</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
