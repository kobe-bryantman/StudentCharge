<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('课程管理 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">课程管理</h1>

    <!-- 操作栏 -->
    <div class="flex-between mb-16">
        <span></span>
        <a th:href="@{/teacher/course/add}" class="btn btn-primary">新增课程</a>
    </div>

    <!-- 成功/错误提示 -->
    <div class="msg msg-success" th:if="${msg != null and msgType == null}" th:text="${msg}"></div>
    <div class="msg msg-error" th:if="${msg != null and msgType != null}" th:text="${msg}"></div>

    <!-- 课程列表 -->
    <div class="card">
        <div class="card-body">
            <div th:if="${courses.isEmpty()}" class="empty">
                <div class="empty-text">暂无课程，请点击右上角"新增课程"创建</div>
            </div>
            <table th:if="${!courses.isEmpty()}" class="table">
                <thead>
                <tr>
                    <th>课程名称</th>
                    <th>课程描述</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${courses}">
                    <td th:text="${c.courseName}">课程名</td>
                    <td th:text="${c.description} ?: '-'" style="max-width: 300px; word-break: break-all;">描述</td>
                    <td>
                        <a th:href="@{/teacher/question/list(courseId=${c.id})}" class="btn btn-primary btn-sm">进入考题管理</a>
                        <a th:href="@{/teacher/course/edit(id=${c.id})}" class="btn btn-warning btn-sm">编辑</a>
                        <form th:action="@{/teacher/course/delete}" method="post" style="display:inline;" onsubmit="return confirm('确定删除该课程吗？课程下考题也会被删除！')">
                            <input type="hidden" name="id" th:value="${c.id}">
                            <button type="submit" class="btn btn-danger btn-sm">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
