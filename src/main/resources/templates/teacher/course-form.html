<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>课程表单 - 在线考试系统</title>
    <th:block th:insert="fragments/layout :: commonHead"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title" th:text="${course != null ? '编辑课程' : '新增课程'}">课程表单</h1>

    <div class="card">
        <form th:action="${course != null} ? @{/teacher/course/edit} : @{/teacher/course/add}" method="post">
            <input type="hidden" name="id" th:if="${course != null}" th:value="${course.id}">
            <div class="form-group">
                <label>课程名称</label>
                <input type="text" name="courseName" class="form-control" required
                       th:value="${course != null ? course.courseName : ''}">
            </div>
            <div class="form-group">
                <label>课程描述</label>
                <textarea name="description" class="form-control"
                          th:text="${course != null ? course.description : ''}"></textarea>
            </div>
            <div class="flex gap-8">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/teacher/course}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
