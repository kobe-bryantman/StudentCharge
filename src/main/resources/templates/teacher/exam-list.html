<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('考试情况 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">考试情况</h1>

    <div class="card">
        <div th:if="${records.isEmpty()}" class="empty">
            <div class="empty-text">暂无考试记录</div>
        </div>
        <table th:if="${!records.isEmpty()}" class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>课程名称</th>
                <th>学生姓名</th>
                <th>第几次</th>
                <th>得分</th>
                <th>状态</th>
                <th>考试时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.id}">1</td>
                <td th:text="${courseMap[r.courseId] != null ? courseMap[r.courseId].courseName : '未知'}">课程名</td>
                <td th:text="${studentMap[r.studentId] != null ? studentMap[r.studentId].name : '未知'}">学生名</td>
                <td th:text="'第' + ${r.examCount} + '次'">第1次</td>
                <td>
                    <span class="score-badge"
                          th:classappend="${r.totalScore >= 80} ? 'score-high' : (${r.totalScore >= 60} ? 'score-mid' : 'score-low')"
                          th:text="${r.totalScore} + '分'">0分</span>
                </td>
                <td>
                    <span th:switch="${r.status}">
                        <span th:case="'submitted'" class="correct">已交卷</span>
                        <span th:case="'ongoing'" class="score-badge score-mid">进行中</span>
                        <span th:case="*" class="text-muted">未开始</span>
                    </span>
                </td>
                <td th:text="${r.examTime != null ? #temporals.format(r.examTime, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                <td>
                    <a th:href="@{/teacher/exam/detail/{id}(id=${r.id})}" class="btn btn-primary btn-sm">查看详情</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
