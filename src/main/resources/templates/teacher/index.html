<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('教师首页 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">教师首页</h1>

    <!-- 欢迎语 -->
    <div class="card">
        <div class="card-body">
            <p class="text-muted">欢迎使用在线考试系统，您可以管理课程、维护题库、查看考试情况。</p>
        </div>
    </div>

    <!-- 功能菜单卡片 -->
    <div class="form-row">
        <div class="card">
            <div class="card-body text-center">
                <h3>个人信息</h3>
                <p class="text-muted">查看和修改个人资料</p>
                <a th:href="@{/teacher/profile}" class="btn btn-primary">进入</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h3>考试课程管理</h3>
                <p class="text-muted">管理课程和题库</p>
                <a th:href="@{/teacher/course/list}" class="btn btn-primary">进入</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h3>考试情况</h3>
                <p class="text-muted">查看学生考试成绩</p>
                <a th:href="@{/teacher/exam/course-list}" class="btn btn-primary">进入</a>
            </div>
        </div>
    </div>

    <!-- 数据统计 -->
    <div class="form-row">
        <div class="card">
            <div class="card-body text-center">
                <h2 th:text="${courseCount}">0</h2>
                <p class="text-muted">门课程</p>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h2 th:text="${questionCount}">0</h2>
                <p class="text-muted">道题目</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
