<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('编辑考题 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">编辑考题</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/teacher/question/edit}" method="post">
                <input type="hidden" name="id" th:value="${question.id}">
                <input type="hidden" name="courseId" th:value="${question.courseId}">

                <div class="form-group">
                    <label>所属课程</label>
                    <input type="text" class="form-control readonly" th:value="${course.courseName}" readonly>
                </div>

                <div class="form-group">
                    <label>题干 <span style="color:red">*</span></label>
                    <textarea name="questionText" class="form-control" required th:text="${question.questionText}"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>题型 <span style="color:red">*</span></label>
                        <select name="questionType" class="form-control" required>
                            <option value="single" th:selected="${question.questionType == 'single'}">单选题</option>
                            <option value="multiple" th:selected="${question.questionType == 'multiple'}">多选题</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>分值 <span style="color:red">*</span></label>
                        <input type="number" name="score" class="form-control" th:value="${question.score}" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>选项A <span style="color:red">*</span></label>
                    <input type="text" name="optionA" class="form-control" th:value="${question.optionA}" required>
                </div>
                <div class="form-group">
                    <label>选项B <span style="color:red">*</span></label>
                    <input type="text" name="optionB" class="form-control" th:value="${question.optionB}" required>
                </div>
                <div class="form-group">
                    <label>选项C <span style="color:red">*</span></label>
                    <input type="text" name="optionC" class="form-control" th:value="${question.optionC}" required>
                </div>
                <div class="form-group">
                    <label>选项D <span style="color:red">*</span></label>
                    <input type="text" name="optionD" class="form-control" th:value="${question.optionD}" required>
                </div>

                <!-- 单选题正确答案：select -->
                <div class="form-group" th:if="${question.questionType == 'single'}">
                    <label>正确答案 <span style="color:red">*</span></label>
                    <select name="correctAnswer" class="form-control">
                        <option value="A" th:selected="${question.correctAnswer == 'A'}">A</option>
                        <option value="B" th:selected="${question.correctAnswer == 'B'}">B</option>
                        <option value="C" th:selected="${question.correctAnswer == 'C'}">C</option>
                        <option value="D" th:selected="${question.correctAnswer == 'D'}">D</option>
                    </select>
                </div>

                <!-- 多选题正确答案：checkbox -->
                <div class="form-group" th:if="${question.questionType == 'multiple'}">
                    <label>正确答案 <span style="color:red">*</span>（可多选）</label>
                    <div style="padding: 8px 0;">
                        <label style="margin-right: 24px; font-weight: normal;">
                            <input type="checkbox" name="correctAnswer" value="A" th:checked="${#strings.contains(question.correctAnswer, 'A')}"> A
                        </label>
                        <label style="margin-right: 24px; font-weight: normal;">
                            <input type="checkbox" name="correctAnswer" value="B" th:checked="${#strings.contains(question.correctAnswer, 'B')}"> B
                        </label>
                        <label style="margin-right: 24px; font-weight: normal;">
                            <input type="checkbox" name="correctAnswer" value="C" th:checked="${#strings.contains(question.correctAnswer, 'C')}"> C
                        </label>
                        <label style="font-weight: normal;">
                            <input type="checkbox" name="correctAnswer" value="D" th:checked="${#strings.contains(question.correctAnswer, 'D')}"> D
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">保存修改</button>
                <a th:href="@{/teacher/question/list(courseId=${question.courseId})}" class="btn btn-secondary">返回</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
