<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>个人信息 - 在线考试系统</title>
    <th:block th:insert="fragments/layout :: commonHead"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: teacherNav"></nav>
<div class="container">
    <h1 class="page-title">个人信息</h1>

    <div class="card">
        <form th:action="@{/teacher/profile}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>登录账号</label>
                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                </div>
                <div class="form-group">
                    <label>工号</label>
                    <input type="text" class="form-control" th:value="${user.teacherNo}" disabled>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" name="name" class="form-control" required th:value="${user.name}">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select name="gender" class="form-control">
                        <option value="男" th:selected="${user.gender == '男'}">男</option>
                        <option value="女" th:selected="${user.gender == '女'}">女</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                </div>
                <div class="form-group">
                    <label>所在学院</label>
                    <input type="text" name="college" class="form-control" th:value="${user.college}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </form>
    </div>
</div>
</body>
</html>
