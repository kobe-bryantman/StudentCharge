<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 在线考试系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <h1 class="login-title">在线考试系统</h1>
        <p class="login-subtitle">Online Examination System</p>

        <!-- 错误提示 -->
        <div class="msg msg-error" th:if="${msg != null}" th:text="${msg}"></div>

        <!-- 登录表单，纯form提交，无JS -->
        <form th:action="@{/doLogin}" method="post">
            <div class="form-group">
                <label for="username">登录账号</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="请输入账号" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">登录密码</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>

        <!-- 测试账号提示 -->
        <div class="login-tip">
            测试账号（密码均为 123456）：<br>
            教师：teacher01 / teacher02<br>
            学生：student01 / student02 / student03
        </div>
    </div>
</div>
</body>
</html>
