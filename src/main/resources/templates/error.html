<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统错误 - 在线考试系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="login-page">
    <div class="login-box text-center">
        <h1 class="login-title">系统错误</h1>
        <p class="login-subtitle">System Error</p>

        <div class="msg msg-error" th:if="${error != null}" th:text="${error}"></div>
        <div class="msg msg-info" th:if="${error == null}">
            服务器开小差了，请稍后重试
        </div>

        <div class="mt-24">
            <a th:href="@{/login}" class="btn btn-primary">返回登录</a>
            <a th:href="@{/hello}" class="btn btn-secondary">返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
