<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- head fragment：设置页面标题、引入公共CSS -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">在线考试系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</th:block>

<!-- 教师端导航栏 fragment -->
<nav th:fragment="teacherNav" class="navbar">
    <a class="navbar-brand" th:href="@{/}">在线考试系统</a>
    <div class="navbar-nav">
        <a th:href="@{/teacher/index}">首页</a>
        <a th:href="@{/teacher/course/list}">课程管理</a>
        <a th:href="@{/teacher/profile}">个人信息</a>
        <a th:href="@{/logout}">退出登录</a>
    </div>
    <span class="navbar-user" th:if="${session.loginUser != null}">
        欢迎，<span th:text="${session.loginUser.name}">用户</span>（教师）
    </span>
</nav>

<!-- 学生端导航栏 fragment -->
<nav th:fragment="studentNav" class="navbar">
    <a class="navbar-brand" th:href="@{/}">在线考试系统</a>
    <div class="navbar-nav">
        <a th:href="@{/student/index}">首页</a>
        <a th:href="@{/student/course}">选课中心</a>
        <a th:href="@{/student/exam}">我的考试</a>
        <a th:href="@{/student/profile}">个人信息</a>
        <a th:href="@{/logout}">退出登录</a>
    </div>
    <span class="navbar-user" th:if="${session.loginUser != null}">
        欢迎，<span th:text="${session.loginUser.name}">用户</span>（学生）
    </span>
</nav>

</body>
</html>
