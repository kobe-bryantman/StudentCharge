<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>考试成绩 - 在线考试系统</title>
    <th:block th:insert="fragments/layout :: commonHead"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: studentNav"></nav>
<div class="container">
    <h1 class="page-title">考试成绩</h1>

    <div class="card text-center">
        <h2 th:text="${course.courseName}" style="margin-bottom:16px;">课程名</h2>
        <div style="font-size:48px; font-weight:bold;"
             th:style="${record.totalScore >= 80} ? 'color:#67c23a;' : (${record.totalScore >= 60} ? 'color:#e6a23c;' : 'color:#f56c6c;')"
             th:text="${record.totalScore} + ' 分'">0分</div>
        <div class="text-muted mt-8" th:text="'正确率：' + ${correctCount} + '/' + ${totalCount}">正确率</div>
        <div class="mt-16">
            <span th:text="'第' + ${record.examCount} + '次考试'">第1次</span>
            <span class="ml-16"></span>
            <span th:text="${record.examTime != null ? #temporals.format(record.examTime, 'yyyy-MM-dd HH:mm') : ''}">考试时间</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><span class="card-title">答题详情</span></div>
        <div class="card-body">
            <div th:each="q, iter : ${questions}" class="question-item">
                <div class="question-title">
                    <span class="question-no" th:text="'第' + ${iter.count} + '题'">第1题</span>
                    <span th:text="${q.questionText}">题干</span>
                    <span class="question-score" th:text="${q.score} + '分'">10分</span>
                </div>
                <div class="question-options">
                    <div class="option" th:text="'A. ' + ${q.optionA}">选项A</div>
                    <div class="option" th:text="'B. ' + ${q.optionB}">选项B</div>
                    <div class="option" th:text="'C. ' + ${q.optionC}">选项C</div>
                    <div class="option" th:text="'D. ' + ${q.optionD}">选项D</div>
                </div>
                <div class="mt-8">
                    <strong>正确答案：</strong><span class="correct" th:text="${q.correctAnswer}">A</span>
                    <span class="ml-24" style="margin-left:24px;"></span>
                    <strong>你的答案：</strong>
                    <span th:each="a : ${answers}" th:if="${a.questionId == q.id}"
                          th:classappend="${a.isCorrect == 1} ? 'correct' : 'wrong'"
                          th:text="${a.studentAnswer != null && a.studentAnswer != '' ? a.studentAnswer : '未作答'}">未作答</span>
                    <span th:each="a : ${answers}" th:if="${a.questionId == q.id}">
                        （<span th:classappend="${a.isCorrect == 1} ? 'correct' : 'wrong'"
                               th:text="${a.isCorrect == 1 ? '正确' : '错误'}">正确</span>，
                        得<span th:text="${a.score}">0</span>分）
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mb-24">
        <a th:href="@{/student/exam}" class="btn btn-primary">返回我的考试</a>
    </div>
</div>
</body>
</html>
