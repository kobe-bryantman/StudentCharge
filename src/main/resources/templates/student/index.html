<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('学生首页 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: studentNav"></nav>
<div class="container">
    <h1 class="page-title">学生首页</h1>

    <!-- 欢迎语 -->
    <div class="card">
        <div class="card-body">
            <p class="text-muted">欢迎使用在线考试系统，您可以选课、参加考试、查看成绩。</p>
        </div>
    </div>

    <!-- 功能菜单卡片 -->
    <div class="form-row">
        <div class="card">
            <div class="card-body text-center">
                <h3>个人信息</h3>
                <p class="text-muted">查看和修改个人资料</p>
                <a th:href="@{/student/profile}" class="btn btn-primary">进入</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h3>选课中心</h3>
                <p class="text-muted">浏览和选择课程</p>
                <a th:href="@{/student/course/available}" class="btn btn-primary">进入</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h3>我的考试</h3>
                <p class="text-muted">参加考试和查看成绩</p>
                <a th:href="@{/student/exam/list}" class="btn btn-primary">进入</a>
            </div>
        </div>
    </div>

    <!-- 数据统计 -->
    <div class="form-row">
        <div class="card">
            <div class="card-body text-center">
                <h2 th:text="${selectedCourses.size()}">0</h2>
                <p class="text-muted">门已选课程</p>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h2 th:text="${recordCount}">0</h2>
                <p class="text-muted">次考试记录</p>
            </div>
        </div>
        <div class="card">
            <div class="card-body text-center">
                <h2 th:text="${submittedCount}">0</h2>
                <p class="text-muted">次已交卷</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
