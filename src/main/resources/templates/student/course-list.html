<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>选课中心 - 在线考试系统</title>
    <th:block th:insert="fragments/layout :: commonHead"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: studentNav"></nav>
<div class="container">
    <h1 class="page-title">选课中心</h1>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>课程名称</th>
                <th>课程描述</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.courseName}">课程名</td>
                <td th:text="${c.description}">描述</td>
                <td>
                    <span th:if="${selectedIds.contains(c.id)}">
                        <a th:href="@{/student/course/drop/{id}(id=${c.id})}" class="btn btn-danger btn-sm">退选</a>
                        <span class="msg-success" style="display:inline-block;padding:5px 10px;">已选</span>
                    </span>
                    <a th:if="${!selectedIds.contains(c.id)}"
                       th:href="@{/student/course/select/{id}(id=${c.id})}"
                       class="btn btn-primary btn-sm">选课</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
