<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('在线答题 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: studentNav"></nav>
<div class="container">
    <h1 class="page-title" th:text="'在线答题 - ' + ${course.courseName}">在线答题</h1>

    <!-- 考试须知 -->
    <div class="card">
        <div class="card-header"><span class="card-title">考试须知</span></div>
        <div class="card-body">
            <p>1. 本次考试共 <strong th:text="${questions.size()}">0</strong> 道题，总分 <strong th:text="${totalScore}">0</strong> 分</p>
            <p>2. 单选题只能选择一个答案，多选题可选择多个答案</p>
            <p>3. 交卷后不能修改答案，请仔细检查后再提交</p>
        </div>
    </div>

    <!-- 无考题提示 -->
    <div th:if="${questions.isEmpty()}" class="card text-center" style="padding:40px;">
        <div class="empty">
            <div class="empty-text">该课程暂无考题</div>
            <a th:href="@{/student/exam/list}" class="btn btn-secondary">返回我的考试</a>
        </div>
    </div>

    <!-- 考题列表 + 交卷表单 -->
    <form th:if="${!questions.isEmpty()}" th:action="@{/student/exam/submit}" method="post"
          onsubmit="return confirm('确定交卷吗？交卷后不能修改答案！')">
        <input type="hidden" name="examRecordId" th:value="${record.id}">

        <div th:each="q, iter : ${questions}" class="question-item">
            <div class="question-title">
                <span class="question-no" th:text="'第' + ${iter.count} + '题'">第1题</span>
                <span th:text="${q.questionText}">题干</span>
                <span class="question-score">
                    <span th:if="${q.questionType == 'single'}">[单选]</span>
                    <span th:if="${q.questionType == 'multiple'}">[多选]</span>
                    <span th:text="${q.score} + '分'">5分</span>
                </span>
            </div>
            <div class="question-options">
                <div class="option">
                    <label>
                        <input th:if="${q.questionType == 'single'}" type="radio"
                               th:name="'answer_' + ${q.id}" value="A">
                        <input th:if="${q.questionType == 'multiple'}" type="checkbox"
                               th:name="'answer_' + ${q.id}" value="A">
                        <span th:text="'A. ' + ${q.optionA}">选项A</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input th:if="${q.questionType == 'single'}" type="radio"
                               th:name="'answer_' + ${q.id}" value="B">
                        <input th:if="${q.questionType == 'multiple'}" type="checkbox"
                               th:name="'answer_' + ${q.id}" value="B">
                        <span th:text="'B. ' + ${q.optionB}">选项B</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input th:if="${q.questionType == 'single'}" type="radio"
                               th:name="'answer_' + ${q.id}" value="C">
                        <input th:if="${q.questionType == 'multiple'}" type="checkbox"
                               th:name="'answer_' + ${q.id}" value="C">
                        <span th:text="'C. ' + ${q.optionC}">选项C</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input th:if="${q.questionType == 'single'}" type="radio"
                               th:name="'answer_' + ${q.id}" value="D">
                        <input th:if="${q.questionType == 'multiple'}" type="checkbox"
                               th:name="'answer_' + ${q.id}" value="D">
                        <span th:text="'D. ' + ${q.optionD}">选项D</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="card text-center">
            <button type="submit" class="btn btn-danger" style="padding:12px 40px; font-size:16px;">
                交 卷
            </button>
            <a th:href="@{/student/exam/list}" class="btn btn-secondary" style="padding:12px 40px; font-size:16px;">
                暂存退出
            </a>
        </div>
    </form>
</div>
</body>
</html>
