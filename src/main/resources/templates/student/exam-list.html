<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: head('我的考试 - 在线考试系统')"></th:block>
</head>
<body>
<nav th:replace="fragments/layout :: studentNav"></nav>
<div class="container">
    <h1 class="page-title">我的考试</h1>

    <div class="card">
        <div class="card-header"><span class="card-title">可参加的考试</span></div>
        <div class="card-body">
            <div th:if="${courses.isEmpty()}" class="empty">
                <div class="empty-text">请先去选课中心选课</div>
                <a th:href="@{/student/course}" class="btn btn-primary">去选课</a>
            </div>
            <table th:if="${!courses.isEmpty()}" class="table">
                <thead>
                <tr><th>课程名称</th><th>操作</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${courses}">
                    <td th:text="${c.courseName}">课程名</td>
                    <td>
                        <a th:href="@{/student/exam/start/{courseId}(courseId=${c.id})}"
                           class="btn btn-primary btn-sm">开始考试</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><span class="card-title">考试记录</span></div>
        <div class="card-body">
            <div th:if="${records.isEmpty()}" class="empty">
                <div class="empty-text">暂无考试记录</div>
            </div>
            <table th:if="${!records.isEmpty()}" class="table">
                <thead>
                <tr><th>课程</th><th>考试次数</th><th>得分</th><th>状态</th><th>考试时间</th><th>操作</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${records}">
                    <td th:text="${courseMap[r.courseId] != null ? courseMap[r.courseId].courseName : '未知'}">课程名</td>
                    <td th:text="'第' + ${r.examCount} + '次'">第1次</td>
                    <td>
                        <span class="score-badge"
                              th:classappend="${r.totalScore >= 80} ? 'score-high' : (${r.totalScore >= 60} ? 'score-mid' : 'score-low')"
                              th:text="${r.totalScore} + '分'">0分</span>
                    </td>
                    <td>
                        <span th:switch="${r.status}">
                            <span th:case="'submitted'" class="correct">已交卷</span>
                            <span th:case="'ongoing'" class="score-badge score-mid">进行中</span>
                            <span th:case="*" class="text-muted">未开始</span>
                        </span>
                    </td>
                    <td th:text="${r.examTime != null ? #temporals.format(r.examTime, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td>
                        <a th:if="${r.status == 'submitted'}"
                           th:href="@{/student/exam/result/{id}(id=${r.id})}"
                           class="btn btn-success btn-sm">查看成绩</a>
                        <a th:if="${r.status == 'ongoing'}"
                           th:href="@{/student/exam/do/{id}(id=${r.id})}"
                           class="btn btn-warning btn-sm">继续答题</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
